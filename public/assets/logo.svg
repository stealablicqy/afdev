<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AF Hub">
  <defs>
    <linearGradient id="afBody" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5566"/>
      <stop offset=".48" stop-color="#c22bd8"/>
      <stop offset="1" stop-color="#5a4bff"/>
    </linearGradient>
    <linearGradient id="afGlyph" x1="20" y1="18" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="afSheen" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="afOrbit" x1="4" y1="10" x2="60" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe0e4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="17" fill="url(#afBody)"/>
  <rect width="64" height="64" rx="17" fill="url(#afSheen)"/>

  <!-- Orbit ring, slowly rotating -->
  <g opacity=".85">
    <ellipse cx="32" cy="32" rx="26" ry="12" fill="none" stroke="url(#afOrbit)" stroke-width="1.2"
             transform="rotate(-28 32 32)">
      <animateTransform attributeName="transform" type="rotate"
                        values="-28 32 32; 332 32 32" dur="14s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="18.4" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>

  <!-- Monogram -->
  <path d="M18.8 45.6 L27.2 18.8 L32.4 18.8 L40.8 45.6 M23.4 36.6 H36.6"
        fill="none" stroke="url(#afGlyph)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparks -->
  <path d="M45.6 14.8 L46.9 18.3 L50.4 19.6 L46.9 20.9 L45.6 24.4 L44.3 20.9 L40.8 19.6 L44.3 18.3 Z"
        fill="#fff" fill-opacity=".96">
    <animate attributeName="opacity" values=".96;.25;.96" dur="3.4s" repeatCount="indefinite"/>
  </path>
  <circle cx="17.4" cy="20" r="1.3" fill="#fff" fill-opacity=".7">
    <animate attributeName="opacity" values=".7;.15;.7" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48.6" cy="45" r="1" fill="#fff" fill-opacity=".55">
    <animate attributeName="opacity" values=".55;.1;.55" dur="5.2s" repeatCount="indefinite"/>
  </circle>
</svg>
